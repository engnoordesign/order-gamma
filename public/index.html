<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Gamma</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1c2033; --muted:#6b7190; --line:#e3e6f0; --brand:#4f46e5; --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12141f; --card:#1c1f30; --text:#eceefb; --muted:#9aa0c0; --line:#2c3048; --brand:#818cf8; --ok:#4ade80; --okbg:#14321f; --bad:#f87171; --badbg:#3a1a1a; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); }
  h1 { font-size:20px; margin:0; letter-spacing:.3px; } h1 span { color:var(--brand); }
  .icon-btn { display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:10px; padding:8px 12px; cursor:pointer; font-size:14px; }
  .icon-btn:hover { border-color:var(--brand); }
  .icon-btn svg { width:20px; height:20px; }
  main { max-width:880px; margin:24px auto; padding:0 16px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  h2 { font-size:16px; margin:0 0 10px; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:32px 16px; text-align:center; color:var(--muted); cursor:pointer; }
  .drop.over { border-color:var(--brand); background:color-mix(in srgb, var(--brand) 8%, transparent); }
  .preview { max-width:100%; max-height:260px; margin-top:12px; border-radius:8px; }
  button.primary { background:var(--brand); color:#fff; border:0; border-radius:10px; padding:10px 18px; font-size:15px; cursor:pointer; }
  button.primary:disabled { opacity:.5; cursor:not-allowed; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { background:var(--bg); border:1px solid var(--line); border-radius:99px; padding:2px 10px; font-size:13px; }
  .banner { padding:12px 14px; border-radius:10px; font-weight:600; }
  .banner.ok { background:var(--okbg); color:var(--ok); } .banner.bad { background:var(--badbg); color:var(--bad); }
  table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; font-size:14px; }
  .tag { padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600; }
  .tag.ok { background:var(--okbg); color:var(--ok); } .tag.bad { background:var(--badbg); color:var(--bad); }
  pre { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; max-height:320px; overflow:auto; font-size:13px; }
  .muted { color:var(--muted); font-size:13px; }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--text); width:min(560px,94vw); padding:20px; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  input[type=text], textarea { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
  .rule { display:grid; grid-template-columns:1fr auto; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
  .rule .row { display:flex; gap:8px; }
  .link { background:none; border:0; color:var(--bad); cursor:pointer; font-size:13px; }
  .actions { display:flex; justify-content:space-between; margin-top:14px; gap:8px; }
</style>
</head>
<body>
<header>
  <h1>Order <span>Gamma</span></h1>
  <button class="icon-btn" id="rulesBtn" title="Setup rules">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    Setup rules
  </button>
</header>

<main>
  <section class="card">
    <h2>1. Upload a file or photo</h2>
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*,.pdf,.txt,.csv,.md,.json" hidden>
      <div id="dropText">Drop a photo / text file here, or click to choose (PDF: first 2 pages are read)</div>
      <img id="preview" class="preview" hidden alt="">
    </label>
    <div style="margin-top:12px">
      <div class="muted">Requirements to check:</div>
      <div class="chips" id="chips"></div>
    </div>
    <div style="margin-top:14px"><button class="primary" id="go" disabled>Check &amp; extract</button> <span class="muted" id="status"></span></div>
  </section>

  <section id="out" hidden>
    <div class="card">
      <div id="banner" class="banner"></div>
      <p class="muted" id="summary"></p>
      <table><thead><tr><th>Requirement</th><th>Status</th><th>Extracted data</th><th>Conf.</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>Full extracted text</h2>
      <pre id="fulltext"></pre>
      <button class="icon-btn" id="copy">Copy text</button>
    </div>
  </section>
</main>

<dialog id="dlg">
  <h2>Setup rules</h2>
  <p class="muted">List what the file/photo must contain. The AI checks each one and extracts its data.</p>
  <div id="ruleList"></div>
  <div class="actions">
    <button class="icon-btn" id="addRule">+ Add requirement</button>
    <button class="primary" id="saveRules">Save</button>
  </div>
</dialog>

<script src="/pdf.min.js"></script>
<script>
const $ =(id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let rules = [];
try { rules = JSON.parse(localStorage.getItem("gamma.rules") || "[]"); } catch {}
let current = null;

function renderChips() {
  $("chips").innerHTML = rules.length ? rules.map((r) => `<span class="chip">${esc(r.name)}</span>`).join("") : '<span class="muted">None yet — click "Setup rules".</span>';
  $("go").disabled = !(current && rules.length);
}

// ---- Rules dialog
let draft = [];
function renderRuleList() {
  $("ruleList").innerHTML = draft.map((r, i) => `
    <div class="rule">
      <div>
        <input type="text" data-i="${i}" data-k="name" placeholder="Requirement (e.g. Invoice number)" value="${esc(r.name)}">
        <textarea data-i="${i}" data-k="description" rows="1" placeholder="Details (optional, e.g. 'format INV-0000')" style="margin-top:6px">${esc(r.description)}</textarea>
      </div>
      <div><button class="link" data-del="${i}">Remove</button></div>
    </div>`).join("") || '<p class="muted">No requirements yet.</p>';
}
$("rulesBtn").onclick = () => { draft = rules.map((r) => ({ ...r })); if (!draft.length) draft.push({ id: crypto.randomUUID(), name: "", description: "" }); renderRuleList(); $("dlg").showModal(); };
$("addRule").onclick = () => { draft.push({ id: crypto.randomUUID(), name: "", description: "" }); renderRuleList(); };
$("ruleList").addEventListener("input", (e) => { const { i, k } = e.target.dataset; if (i != null) draft[i][k] = e.target.value; });
$("ruleList").addEventListener("click", (e) => { if (e.target.dataset.del != null) { draft.splice(e.target.dataset.del, 1); renderRuleList(); } });
$("saveRules").onclick = () => {
  rules = draft.filter((r) => r.name.trim());
  try { localStorage.setItem("gamma.rules", JSON.stringify(rules)); } catch {}
  $("dlg").close(); renderChips();
};

// ---- File handling
function setFile(f) {
  if (!f) return;
  current = f;
  $("dropText").textContent = `${f.name} (${(f.size / 1024).toFixed(0)} KB)`;
  const img = $("preview");
  if (f.type.startsWith("image/")) { img.src = URL.createObjectURL(f); img.hidden = false; } else img.hidden = true;
  renderChips();
}
$("file").onchange = (e) => setFile(e.target.files[0]);
["dragover", "dragenter"].forEach((ev) => $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", (e) => setFile(e.dataTransfer.files[0]));

const toB64 = (f) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(f); });

let backend = "ollama";
fetch("/api/info").then((r) => r.json()).then((j) => { backend = j.backend; }).catch(() => {});

// Render the first pages of a PDF to JPEG (base64) so a local vision model can read them.
const MAX_PDF_PAGES = 2;
async function pdfToImages(f) {
  if (!window.pdfjsLib) throw new Error("PDF reader could not load. Upload page images instead.");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "/pdf.worker.min.js";
  // pdf.js schedules rendering with requestAnimationFrame, which never fires in hidden/background tabs.
  window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
  const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
  const out = [];
  for (let n = 1; n <= Math.min(pdf.numPages, MAX_PDF_PAGES); n++) {
    const page = await pdf.getPage(n);
    const base = page.getViewport({ scale: 1 });
    const viewport = page.getViewport({ scale: 1400 / Math.max(base.width, base.height) });
    const c = document.createElement("canvas");
    c.width = viewport.width; c.height = viewport.height;
    await page.render({ canvasContext: c.getContext("2d"), viewport }).promise;
    out.push(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
  }
  return out;
}

$("go").onclick = async () => {
  $("go").disabled = true; $("status").textContent = "Analyzing…"; $("out").hidden = true;
  try {
    const data = await toB64(current);
    const file = { name: current.name, mediaType: current.type, data };
    if (current.type === "application/pdf" && backend === "ollama") {
      $("status").textContent = "Reading PDF pages…";
      file.images = await pdfToImages(current);
      file.data = "";
      $("status").textContent = `Analyzing ${file.images.length} page(s) — local AI on CPU can take several minutes…`;
    } else $("status").textContent = "Analyzing — local AI can take several minutes…";
    const res = await fetch("/api/analyze", { method: "POST", body: JSON.stringify({ file, rules }) });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error);
    show(j); $("status").textContent = "";
  } catch (e) { $("status").textContent = "Error: " + e.message; }
  $("go").disabled = false;
};

function show(j) {
  $("out").hidden = false;
  const b = $("banner");
  b.className = "banner " + (j.passed ? "ok" : "bad");
  b.textContent = j.passed ? "✔ All requirements found" : "✘ Missing requirements: " + rules.filter((r) => !(j.results.find((x) => x.id === r.id) || {}).found).map((r) => r.name).join(", ");
  $("summary").textContent = `${j.document_type} — ${j.summary}`;
  $("rows").innerHTML = rules.map((r) => {
    const x = j.results.find((o) => o.id === r.id) || { found: false, extracted_value: "", confidence: 0, note: "No result" };
    return `<tr><td>${esc(r.name)}</td><td><span class="tag ${x.found ? "ok" : "bad"}">${x.found ? "Found" : "Missing"}</span></td>
      <td>${esc(x.extracted_value)}${x.note ? `<div class="muted">${esc(x.note)}</div>` : ""}</td><td>${Math.round((x.confidence || 0) * 100)}%</td></tr>`;
  }).join("");
  $("fulltext").textContent = j.full_text;
}
$("copy").onclick = () => navigator.clipboard.writeText($("fulltext").textContent);

renderChips();
</script>
</body>
</html>
